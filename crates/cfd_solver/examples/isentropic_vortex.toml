# 2D isentropic vortex advection — spatial order-of-accuracy harness.
#
#   cargo run --release -p cfd_solver --example isentropic_vortex -- \
#       crates/cfd_solver/examples/isentropic_vortex.toml
#
# The vortex is a smooth exact Euler solution (Shu 1998, ICASE 97-65 §4.1) that
# advects unchanged with the mean flow, so the L1 error must fall at the scheme's
# formal spatial order under mesh refinement. On the uniform grid the flux is
# piecewise-constant Godunov (HLLC), i.e. formally 1st order.

[vortex]
domain = 10.0   # square side L; vortex centered at (L/2, L/2)
beta   = 5.0    # vortex strength (Shu's value)
gamma  = 1.4
mean_u = 0.5    # mean-flow velocity the vortex advects with
mean_v = 0.5

[run]
t_final    = 1.0
cfl        = 0.3
scheme     = "hllc"   # "hllc" or "rusanov"
integrator = "rk3"    # "rk3" or "euler"

[convergence]
resolutions  = [40, 80, 160, 320]  # cells per side; each refines the last by 2×
design_order = 1.0                  # Godunov/HLLC on a uniform grid is 1st order
order_tol    = 0.2

[package]
name = "cfd_ibm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Sharp-interface ghost-cell immersed boundary method: solid mask, cylinder geometry, image-point mirror."

[dependencies]
field_core.workspace = true
grass_app.workspace = true
grass_scheduler.workspace = true
cfd_state.workspace = true
cfd_eos.workspace = true

# The `cylinder_drag_validation` example wires a full solver (flux + viscous +
# integrator + boundaries) around the IBM plugins, and reads its case from a TOML
# file. These are the assembly crates the example needs — the physics-agnostic
# solver core plus IO — kept as dev-deps so the library itself stays lean and
# p4est-free (unlike the top `test_cfd` crate).
[dev-dependencies]
cfd_solver.workspace = true
cfd_boundary.workspace = true
grass_io.workspace = true
serde.workspace = true
# The DEM-CFD coupling examples wire a SOIL (Lagrangian particle) sub-App to a
# FIELD (gas) sub-App through GRASS_MULTI. These are dev-deps: the seam contract
# and drag closures in `src` stay soil-agnostic, so the library never depends on
# SOIL — only the coupling examples do.
grass_multi.workspace = true
soil_core.workspace = true
soil_verlet.workspace = true
# The `cfd_ibm_fiber` example builds its immersed body as a BPM bonded-sphere
# chain via DIRT's bond model (dirt_bond/dirt_atom on the SOIL substrate), so the
# fiber crossing the DEM→CFD seam is a genuine bonded clump, not an ad-hoc line of
# spheres. Dev-deps only: the library core stays DIRT-free (only this example
# consumes it). DIRT pins GRASS/SOIL by the same Gitea URLs the workspace already
# `[patch]`es to the sibling path checkouts, so there is one App/Atom type across
# the coupled sub-Apps.
dirt_bond = { git = "ssh://git@192.168.0.170:2222/SueHeir/dirt.git", rev = "b4a23e4606a1fa8d4dc9f1196ca7ac6b7c3155f0", default-features = false, features = ["precision-double"] }
dirt_atom = { git = "ssh://git@192.168.0.170:2222/SueHeir/dirt.git", rev = "b4a23e4606a1fa8d4dc9f1196ca7ac6b7c3155f0", default-features = false, features = ["precision-double"] }
# The `plume_surface` example additionally drives the dev_soil_sph granular-SPH (μ(I)
# continuum) code as the Lagrangian sub-App, so the granular phase is a real
# elasto-viscoplastic continuum rather than discrete DEM grains. Same seam.
sph_core.workspace = true
sph_atom.workspace = true
sph_constitutive.workspace = true
sph_physics.workspace = true

[[example]]
name = "cylinder_drag_validation"
path = "examples/cylinder_drag_validation.rs"

[[example]]
name = "settling_sphere"
path = "examples/settling_sphere.rs"

[[example]]
name = "sphere_drag_resolved"
path = "examples/sphere_drag_resolved.rs"


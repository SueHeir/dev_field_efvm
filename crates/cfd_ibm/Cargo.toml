[package]
name = "cfd_ibm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Sharp-interface ghost-cell immersed boundary method: solid mask, cylinder geometry, image-point mirror."

[dependencies]
field_core.workspace = true
grass_app.workspace = true
grass_scheduler.workspace = true
cfd_state.workspace = true
cfd_eos.workspace = true

# The `cylinder_drag_validation` example wires a full solver (flux + viscous +
# integrator + boundaries) around the IBM plugins, and reads its case from a TOML
# file. These are the assembly crates the example needs — the physics-agnostic
# solver core plus IO — kept as dev-deps so the library itself stays lean and
# p4est-free (unlike the top `test_cfd` crate).
[dev-dependencies]
cfd_solver.workspace = true
cfd_boundary.workspace = true
grass_io.workspace = true
serde.workspace = true
# The DEM-CFD coupling examples wire a SOIL (Lagrangian particle) sub-App to a
# FIELD (gas) sub-App through GRASS_MULTI. These are dev-deps: the seam contract
# and drag closures in `src` stay soil-agnostic, so the library never depends on
# SOIL — only the coupling examples do.
grass_multi.workspace = true
soil_core.workspace = true
soil_verlet.workspace = true

[[example]]
name = "cylinder_drag_validation"
path = "examples/cylinder_drag_validation.rs"

[[example]]
name = "settling_sphere"
path = "examples/settling_sphere.rs"

[[example]]
name = "sphere_drag_resolved"
path = "examples/sphere_drag_resolved.rs"

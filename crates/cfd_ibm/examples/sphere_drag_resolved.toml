# Resolved DEM-CFD seam — sphere surface-load handoff via the cut-cell IBM.
#
#   cargo run --release -p cfd_ibm --example sphere_drag_resolved -- \
#       crates/cfd_ibm/examples/sphere_drag_resolved.toml
#
# A cfd_ibm::Sphere is immersed in a FIELD gas state; the cut-cell embedded-
# boundary integrator turns the pressure field into the net force handed to the
# DEM particle. Two analytic fields with exact answers validate the handoff:
# uniform pressure -> zero net force, hydrostatic pressure -> Archimedes buoyancy.
# Tolerances reflect the 8^3-quadrature cut-cell metrics at D/dx = 16 (a few
# percent), NOT tuned to pass.

[gas]
rho = 1.2          # kg/m^3
p = 1.0e5          # Pa
mu = 1.8e-5        # Pa.s

[sphere]
cx = 0.0
cy = 0.0
cz = 0.0
radius = 0.1       # m  (D = 0.2 m)

[gravity]
gz = -9.81         # m/s^2

# Reference relative velocity / Reynolds number (informational: sets the target
# Cd(Re) the resolved viscous follow-up aims at).
[flow]
u_inf = 0.15
reynolds = 20.0

# FIELD mesh: D/dx = 16, sphere fully enclosed with margin.
[grid]
nx = 64
ny = 64
nz = 64
ng = 2
bounds_lo = [-0.4, -0.4, -0.4]
bounds_hi = [0.4, 0.4, 0.4]

[validation]
tol_buoyancy = 0.05        # cut-cell buoyancy vs Archimedes (D/dx=16, 8^3 quad)
tol_uniform_ratio = 0.02   # |F_uniform| / |F_hydrostatic| consistency residual
tol_volume = 0.02          # recovered solid volume vs 4/3 pi R^3

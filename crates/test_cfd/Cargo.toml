[package]
name = "test_cfd"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Top-level compressible-CFD solver on the FIELD substrate: default plugin bundle, prelude, examples."
autotests = false

[dependencies]
field_core.workspace = true
grass_app.workspace = true
cfd_state.workspace = true
cfd_eos.workspace = true
cfd_riemann.workspace = true
cfd_boundary.workspace = true
cfd_solver.workspace = true
cfd_ibm.workspace = true
cfd_output.workspace = true
grass_io.workspace = true
field_amr.workspace = true
grass_scheduler.workspace = true
grass_mpi.workspace = true
field_p4est = { workspace = true, optional = true }

[features]
# Flip CommPlugin from the serial no-op backend to the real MPI backend (rsmpi),
# for MPI-specific consumers. Off by default so the normal build/test/clippy path
# stays single-process and p4est-free.
mpi_backend = ["dep:field_p4est", "field_core/mpi_backend", "grass_mpi/mpi_backend"]

[[test]]
name = "p4est_cutcell"
path = "tests/p4est_cutcell.rs"
required-features = ["mpi_backend"]

[[test]]
name = "p4est_euler"
path = "tests/p4est_euler.rs"
required-features = ["mpi_backend"]

[[test]]
name = "p4est_isentropic_vortex_order"
path = "tests/p4est_isentropic_vortex_order.rs"
required-features = ["mpi_backend"]

[[test]]
name = "p4est_muscl"
path = "tests/p4est_muscl.rs"
required-features = ["mpi_backend"]

[[test]]
name = "p4est_regrid"
path = "tests/p4est_regrid.rs"
required-features = ["mpi_backend"]

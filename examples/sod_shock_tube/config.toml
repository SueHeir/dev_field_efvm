# DEMO (not a validation): config-driven Sod shock tube. This case exercises
# declarative input + VTK output; it has no exact-Riemann PASS/FAIL gate.
#
# Run:
#   cargo run -p dev_field_efvm --bin config_driven -- examples/config_driven/config.toml

[grid]
nx = 100
ny = 1
nz = 1
ng = 2
bounds_lo = [0.0, 0.0, 0.0]
bounds_hi = [1.0, 0.01, 0.01]

[solver]
cfl = 0.4
viscous = false

[run]
steps = 80

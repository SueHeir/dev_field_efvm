# Drafting–Kissing–Tumbling: two circular particles settling in a viscous fluid,
# resolved by the sharp-interface ghost-cell IBM (the 2-D two-particle DKT of
# Glowinski et al. 2001 / Feng & Michaelides 2004; experiment Fortes, Joseph &
# Lundgren 1987). Matched dimensionless groups: density ratio rho_p/rho_f = 1.5,
# Galileo number Ga = u_g d / nu = 40 (u_g = sqrt((s-1) g d) the gravitational
# velocity). Run at low Mach (M_g ~ 0.11) as an incompressible surrogate: the
# explicit compressible solver's acoustic/viscous dt makes settling a macroscopic
# distance expensive, so the grid is D/dx = 10 and the two particles start ~0.6d
# apart (surface gap) with a tiny 0.008d lateral offset to seed the tumble. The
# leading particle's forming wake first nudges the pair slightly apart, then draws
# the trailing particle in (drafting); they close to contact (kissing, the
# soft-sphere spring engages within contact_range); the tandem is unstable and
# separates laterally with the trailing particle overtaking (tumbling).
#
#   cargo run --release -p dev_field_efvm --bin dkt_sedimentation -- \
#       examples/dkt_sedimentation/config.toml
[grid]
nx = 120
ny = 390
nz = 1
ng = 2
bounds_lo = [0.0, 0.0, 0.0]
bounds_hi = [0.024, 0.078, 0.0002]
[flow]
rho = 1.0
p = 1.0e5
[particle]
diameter = 0.002
density_ratio = 1.5
u_grav = 40.0
re_settle = 40.0
n_theta = 100
[init]
lead_x  = 0.012
lead_y  = 0.060
trail_x = 0.0120160
trail_y = 0.0632
[contact]
range_cells = 3.0
stiffness_scale = 150.0
[solver]
cfl = 0.3
muscl = false
[run]
steps = 62000
print_every = 2000
[validation]
draft_close_frac = 0.4    # gap must close >=40% from the max approach gap (+ trailing catches up)
# Kissing = closest surface approach within 0.5d (5 cells). A resolved IBM without
# a sub-grid lubrication model naturally halts the approach at ~0.35d (the fluid
# pressure in the thinning film diverges at the grid scale), which is exactly why
# DKT references add a short-range repulsion for the unresolved film; 0.5d is that
# near-contact/collision-film scale, comfortably reached here.
kiss_gap_cells = 5.0
tumble_lateral_d = 0.5     # post-kiss lateral separation (+ trailing overtakes)
max_mach = 0.30            # incompressible-surrogate guard

# Schäfer & Turek (1996) DFG flow-around-cylinder benchmark, case 2D-1
# (steady, Re = 20). Declarative case definition for the
# `cylinder_drag_validation` example. Reference: c_D = 5.5795, c_L = 0.0106.
#
#   cargo run --release -p dev_field_efvm --bin cylinder_drag_validation -- \
#       examples/cylinder_drag_validation/config.toml
#
# Re = 20 is a STEADY case (a cylinder wake first sheds near Re ~ 46-50, higher
# still for this channel blockage), so the drag MUST settle to a fixed plateau —
# a transient value that merely passes through the reference does not validate.
# In a compressible solver run at low Mach the reflective velocity-inlet /
# pressure-outlet pair otherwise traps acoustic energy and Cd(t) never plateaus;
# the downstream [sponge] absorbing layer fixes that (see the example docstring).
# The [validation] block therefore gates on TWO things: Cd accuracy and a steady
# plateau (small peak-to-peak of Cd over the averaging window). Cl is reported as
# a non-gating diagnostic because the tiny benchmark lift is dominated here by
# grid-alignment/staircase asymmetry unless a separate converged lift campaign is
# run.
#
# Grid convergence of the STEADY marker-integrated drag toward the benchmark
# (measured with the sponge on, averaged over a converged window; this is a
# *first-order* ghost-cell IBM, so the drag converges ~linearly and brackets the
# benchmark between D/dx = 15 and 20):
#     D/dx = 10 (220x41):  c_D = 5.126  (-8.1 %)   c_L = 0.0138
#     D/dx = 15 (330x61):  c_D = 5.466  (-2.0 %)   c_L = 0.089  (see note)
#     D/dx = 20 (440x82):  c_D = 5.631  (+0.9 %)   c_L = 0.0124   <- this case
# NOTE: c_L is a small quantity (~0.01) set by the top/bottom asymmetry of the
# staircased surface and is therefore only meaningful at grid-aligned resolutions
# where the D-cell-wide cylinder and its centre land on cell lines (D/dx = 10, 20);
# the odd 15-cell diameter mis-aligns the staircase and injects spurious lift.
# Because that series is not a converged lift reference, c_L is not a validation
# gate. The 5 % Cd tolerance is set from the convergence behaviour above
# (comfortably met at D/dx = 20), NOT tuned to pass.

[grid]
# Channel 2.2 x 0.41 (the DFG geometry), one cell thick in z (2-D). D/dx = 20.
nx = 440
ny = 82
nz = 1
ng = 2
bounds_lo = [0.0, 0.0, 0.0]
bounds_hi = [2.2, 0.41, 0.041]

[flow]
rho = 1.0
p = 1.0e5           # -> sound speed ~374 m/s
u_mean = 50.0       # mean inflow; parabolic peak = 75 -> M_max ~= 0.20
reynolds = 20.0     # sets mu = rho * u_mean * D / Re = 0.25

[cylinder]
cx = 0.2
cy = 0.2
diameter = 0.1
channel_height = 0.41

[solver]
cfl = 0.3
muscl = false

[sponge]
# Downstream absorbing (fringe) layer over x in [x_start, 2.2] that relaxes the
# solution toward the undisturbed parabolic channel flow, so outgoing acoustic and
# vortical fluctuations leave the domain instead of reflecting off the pressure
# outlet and re-exciting a channel resonance. It sits ~12 D downstream of the
# cylinder (wake fully recovered by then at Re = 20), so it does not touch the drag.
x_start = 1.4       # zone spans the last ~0.8 m of the 2.2 m channel
sigma = 1.0e4       # relaxation rate [1/s]; strength ramps quadratically to the outlet

[run]
steps = 44000       # RK substeps: reaches a flat plateau by ~step 20000 at D/dx = 20
print_every = 4000
average_frac = 0.1  # average c_D / c_L over the last 10 % (deep in the plateau)

[validation]
cd_ref = 5.5795     # Schäfer & Turek 1996, DFG 2D-1 (consensus ~5.57-5.59)
cl_ref = 0.0106     # DFG 2D-1 benchmark lift coefficient
tol_rel = 0.05      # relative Cd tolerance (from grid convergence, not tuned)
steady_ptp_tol = 0.02  # max Cd peak-to-peak over the window: the anti-transient gate

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly full validation (adds the heavy wait-for-plateau cylinder-drag gate).
    - cron: "0 6 * * *"

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  test:
    name: build + test + validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev_field_efvm
        uses: actions/checkout@v4
        with:
          path: dev_field_efvm

      - name: Checkout field sibling
        uses: actions/checkout@v4
        with:
          repository: SueHeir/field
          path: field

      - name: Checkout grass sibling
        uses: actions/checkout@v4
        with:
          repository: SueHeir/grass
          path: grass

      - name: Checkout soil sibling
        uses: actions/checkout@v4
        with:
          repository: SueHeir/soil
          path: soil

      - name: Install OpenMPI and p4est
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin libp4est-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dev_field_efvm -> target

      - name: Build workspace
        working-directory: dev_field_efvm
        run: cargo build -p cfd_state -p cfd_eos -p cfd_riemann -p cfd_solver -p cfd_boundary -p cfd_ibm -p cfd_output --all-targets

      - name: Test workspace
        working-directory: dev_field_efvm
        run: cargo test -p cfd_state -p cfd_eos -p cfd_riemann -p cfd_solver -p cfd_boundary -p cfd_ibm -p cfd_output

      # Periodic boundaries are FIELD halo links, so they must give the same
      # answer on any rank count: re-launches itself under mpirun on 1-4 ranks.
      # (The mpi_backend feature also pulls in field_p4est, hence P4EST_PREFIX.)
      - name: Periodic pulse across rank counts (mpirun)
        working-directory: dev_field_efvm
        env:
          P4EST_PREFIX: /usr
        run: cargo test --release --features mpi_backend --test periodic_mpi

      # Every push/PR runs the fast smoke gates; the nightly `schedule` run (and
      # a manual workflow_dispatch) runs `full`, which adds the heavy cylinder
      # drag gate. This keeps every documented validation under automated
      # coverage without paying the multi-minute plateau cost on every push.
      - name: Run validation (smoke on push/PR, full on schedule/dispatch)
        working-directory: dev_field_efvm
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            validation/run.sh full
          else
            validation/run.sh smoke
          fi
